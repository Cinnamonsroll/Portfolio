<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <rect width="1200" height="600" fill="#130f0c"/>

  <defs>
    <pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse">
      <line x1="48" y1="0" x2="48" y2="48" stroke="#2a2420" stroke-width="0.5"/>
      <line x1="0" y1="48" x2="48" y2="48" stroke="#2a2420" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="gl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8c44a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#e8c44a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#g)"/>
  <rect width="1200" height="600" fill="url(#gl)"/>

  <rect x="0" y="0" width="1200" height="1" fill="#e8c44a" opacity="0.12"/>
  <rect x="0" y="599" width="1200" height="1" fill="#e8c44a" opacity="0.2"/>

  <rect x="60" y="60" width="16" height="16" rx="4" stroke="#e8c44a" stroke-width="1.5" opacity="0.25"/>
  <rect x="1124" y="524" width="16" height="16" rx="4" stroke="#e8c44a" stroke-width="1.5" opacity="0.25"/>

  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#f0ebe3">Crafts</text>

  <text x="600" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#a89f93">A little playground of ideas</text>

  <!-- Workbench / table surface -->
  <rect x="200" y="340" width="800" height="8" rx="2" fill="#3a342e" opacity="0.5"/>
  <rect x="260" y="348" width="12" height="60" rx="2" fill="#2a2420" opacity="0.4"/>
  <rect x="928" y="348" width="12" height="60" rx="2" fill="#2a2420" opacity="0.4"/>

  <!-- Pancake icon (crafts logo) -->
  <g transform="translate(560, 160)" opacity="0.15">
    <ellipse cx="40" cy="30" rx="36" ry="10" fill="#e8c44a"/>
    <ellipse cx="40" cy="25" rx="34" ry="8" fill="#d4a84a"/>
    <ellipse cx="40" cy="15" rx="30" ry="10" fill="#e8c44a"/>
    <ellipse cx="40" cy="10" rx="28" ry="7" fill="#f0d070"/>
    <ellipse cx="40" cy="5" rx="24" ry="8" fill="#f5da80"/>
    <circle cx="32" cy="4" r="2.5" fill="#e8c44a"/>
    <circle cx="40" cy="1" r="2" fill="#e8c44a"/>
    <circle cx="48" cy="4" r="2.5" fill="#e8c44a"/>
  </g>

  <!-- Scattered craft items on the table -->
  <!-- Pencil -->
  <g transform="translate(300, 280)" opacity="0.12">
    <rect x="0" y="0" width="80" height="8" rx="2" fill="#e8c44a" transform="rotate(-15)"/>
    <polygon points="0,0 -10,4 -10,-4" fill="#f0ebe3" transform="rotate(-15)"/>
    <rect x="76" y="-2" width="6" height="12" rx="1" fill="#a89f93" transform="rotate(-15)"/>
  </g>

  <!-- Scissors -->
  <g transform="translate(780, 270)" opacity="0.12">
    <ellipse cx="-8" cy="0" rx="8" ry="4" fill="none" stroke="#a89f93" stroke-width="1.5"/>
    <ellipse cx="-8" cy="20" rx="8" ry="4" fill="none" stroke="#a89f93" stroke-width="1.5"/>
    <line x1="-2" y1="3" x2="30" y2="10" stroke="#a89f93" stroke-width="1.5"/>
    <line x1="-2" y1="17" x2="30" y2="10" stroke="#a89f93" stroke-width="1.5"/>
  </g>

  <!-- Sticky note -->
  <g transform="translate(640, 230)" opacity="0.12">
    <rect x="0" y="0" width="60" height="60" rx="2" fill="#e8c44a" transform="rotate(6)"/>
    <line x1="10" y1="20" x2="50" y2="20" stroke="#130f0c" stroke-width="0.8" opacity="0.3" transform="rotate(6)"/>
    <line x1="10" y1="30" x2="45" y2="30" stroke="#130f0c" stroke-width="0.8" opacity="0.3" transform="rotate(6)"/>
    <line x1="10" y1="40" x2="35" y2="40" stroke="#130f0c" stroke-width="0.8" opacity="0.3" transform="rotate(6)"/>
  </g>

  <!-- Paperclip -->
  <g transform="translate(500, 295) rotate(20)" opacity="0.12">
    <path d="M0,0 L0,25 Q0,30 5,30 L15,30 Q20,30 20,25 L20,8 Q20,4 16,4 L8,4 Q4,4 4,8 L4,20" stroke="#a89f93" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Star (doodle) -->
  <g transform="translate(440, 250)" opacity="0.15">
    <path d="M0,-12 L3,-4 L11,-4 L5,1 L7,9 L0,5 L-7,9 L-5,1 L-11,-4 L-3,-4 Z" stroke="#e8c44a" stroke-width="1" fill="none"/>
  </g>

  <!-- Heart (doodle) -->
  <g transform="translate(730, 255)" opacity="0.12">
    <path d="M0,-5 Q-10,-15 -16,-8 Q-22,-1 0,12 Q22,-1 16,-8 Q10,-15 0,-5 Z" stroke="#e8c44a" stroke-width="1" fill="none"/>
  </g>

  <!-- Sparkles -->
  <g opacity="0.1">
    <path d="M340 175 L343 182 L350 182 L344 187 L346 194 L340 189 L334 194 L336 187 L330 182 L337 182 Z" stroke="#e8c44a" stroke-width="0.8" fill="none"/>
    <path d="M850 175 L852 179 L856 179 L853 182 L854 186 L850 183 L846 186 L847 182 L844 179 L848 179 Z" stroke="#e8c44a" stroke-width="0.8" fill="none"/>
  </g>

  <!-- Subtle label -->
  <text x="600" y="560" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a89f93" opacity="0.3" style="letter-spacing: 0.08em">PANCAKE.WTF</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <rect width="1200" height="600" fill="#0f0f1a"/>

  <defs>
    <pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse">
      <line x1="48" y1="0" x2="48" y2="48" stroke="#1a1a2e" stroke-width="0.5"/>
      <line x1="0" y1="48" x2="48" y2="48" stroke="#1a1a2e" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="gl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="o" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="y" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="i" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="v" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#g)"/>
  <rect width="1200" height="600" fill="url(#gl)"/>

  <rect x="0" y="0" width="1200" height="1" fill="#8B5CF6" opacity="0.12"/>

  <rect x="60" y="60" width="16" height="16" rx="4" stroke="#8B5CF6" stroke-width="1.5" opacity="0.2"/>
  <rect x="1124" y="524" width="16" height="16" rx="4" stroke="#8B5CF6" stroke-width="1.5" opacity="0.2"/>

  <!-- Eyedropper icon -->
  <g transform="translate(580, 100)" opacity="0.15">
    <path d="M0,24 L18,6 L22,10 L4,28 Z" fill="none" stroke="#f0ebe3" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M18,6 L22,10" stroke="#f0ebe3" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="20" cy="12" r="12" fill="none" stroke="#f0ebe3" stroke-width="1.5"/>
  </g>

  <!-- Colour swatches grid -->
  <!-- Top row -->
  <rect x="340" y="150" width="60" height="60" rx="8" fill="url(#r)"/>
  <rect x="410" y="150" width="60" height="60" rx="8" fill="url(#o)"/>
  <rect x="480" y="150" width="60" height="60" rx="8" fill="url(#y)"/>
  <rect x="550" y="150" width="60" height="60" rx="8" fill="url(#g)"/>
  <rect x="620" y="150" width="60" height="60" rx="8" fill="url(#b)"/>
  <rect x="690" y="150" width="60" height="60" rx="8" fill="url(#i)"/>
  <rect x="760" y="150" width="60" height="60" rx="8" fill="url(#v)"/>
  <rect x="830" y="150" width="60" height="60" rx="8" fill="url(#p)"/>

  <!-- Middle row (shifted hues) -->
  <rect x="340" y="218" width="60" height="60" rx="8" fill="#FCA5A5"/>
  <rect x="410" y="218" width="60" height="60" rx="8" fill="#FDBA74"/>
  <rect x="480" y="218" width="60" height="60" rx="8" fill="#FDE047"/>
  <rect x="550" y="218" width="60" height="60" rx="8" fill="#86EFAC"/>
  <rect x="620" y="218" width="60" height="60" rx="8" fill="#67E8F9"/>
  <rect x="690" y="218" width="60" height="60" rx="8" fill="#93C5FD"/>
  <rect x="760" y="218" width="60" height="60" rx="8" fill="#C4B5FD"/>
  <rect x="830" y="218" width="60" height="60" rx="8" fill="#F9A8D4"/>

  <!-- Bottom row (even lighter) -->
  <rect x="340" y="286" width="60" height="60" rx="8" fill="#FEE2E2"/>
  <rect x="410" y="286" width="60" height="60" rx="8" fill="#FFEDD5"/>
  <rect x="480" y="286" width="60" height="60" rx="8" fill="#FEF9C3"/>
  <rect x="550" y="286" width="60" height="60" rx="8" fill="#DCFCE7"/>
  <rect x="620" y="286" width="60" height="60" rx="8" fill="#CFFAFE"/>
  <rect x="690" y="286" width="60" height="60" rx="8" fill="#DBEAFE"/>
  <rect x="760" y="286" width="60" height="60" rx="8" fill="#EDE9FE"/>
  <rect x="830" y="286" width="60" height="60" rx="8" fill="#FCE7F3"/>

  <!-- Active picked colour preview -->
  <g transform="translate(380, 390)">
    <rect x="0" y="0" width="440" height="64" rx="12" fill="#1F1E1D" stroke="#3a3a5e" stroke-width="1"/>
    <rect x="8" y="8" width="56" height="48" rx="6" fill="#8B5CF6"/>
    <text x="80" y="30" font-family="monospace, sans-serif" font-size="13" fill="#EDEDED" font-weight="500">HEX  #8B5CF6</text>
    <text x="80" y="48" font-family="monospace, sans-serif" font-size="11" fill="#a89f93">RGB  139   92  246</text>
    <text x="260" y="30" font-family="monospace, sans-serif" font-size="11" fill="#a89f93">HSL  255  89%  66%</text>
    <text x="260" y="48" font-family="monospace, sans-serif" font-size="11" fill="#a89f93">CMYK  43  63   0   4</text>
  </g>

  <!-- Title -->
  <text x="600" y="500" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#f0ebe3">Spectra</text>

  <text x="600" y="526" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#a89f93">Ctrl+.  anywhere, instantly</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <rect width="1200" height="600" fill="#0f0f1a"/>

  <defs>
    <pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse">
      <line x1="48" y1="0" x2="48" y2="48" stroke="#1a1a2e" stroke-width="0.5"/>
      <line x1="0" y1="48" x2="48" y2="48" stroke="#1a1a2e" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="gl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B68B5" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#8B68B5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#g)"/>
  <rect width="1200" height="600" fill="url(#gl)"/>

  <rect x="0" y="0" width="1200" height="1" fill="#8B68B5" opacity="0.12"/>

  <rect x="60" y="60" width="16" height="16" rx="4" stroke="#8B68B5" stroke-width="1.5" opacity="0.2"/>
  <rect x="1124" y="524" width="16" height="16" rx="4" stroke="#8B68B5" stroke-width="1.5" opacity="0.2"/>

  <!-- Title -->
  <text x="600" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#f0ebe3">Numeral</text>

  <text x="600" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#a89f93">Guess the secret 5-digit code</text>

  <!-- Game board rows -->
  <!-- Row 1: near, far, far, close, near -->
  <g transform="translate(444, 145)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="#C6795A" stroke="#C6795A" stroke-width="2"/>
    <rect x="64" y="0" width="56" height="56" rx="8" fill="#A85252" stroke="#A85252" stroke-width="2"/>
    <rect x="128" y="0" width="56" height="56" rx="8" fill="#A85252" stroke="#A85252" stroke-width="2"/>
    <rect x="192" y="0" width="56" height="56" rx="8" fill="#C4A254" stroke="#C4A254" stroke-width="2"/>
    <rect x="256" y="0" width="56" height="56" rx="8" fill="#C6795A" stroke="#C6795A" stroke-width="2"/>
    <text x="28" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">3</text>
    <text x="92" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">0</text>
    <text x="156" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">6</text>
    <text x="220" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">8</text>
    <text x="284" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">5</text>
  </g>

  <!-- Row 2: correct, close, correct, joker, joker -->
  <g transform="translate(444, 209)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="#6B9E7A" stroke="#6B9E7A" stroke-width="2"/>
    <rect x="64" y="0" width="56" height="56" rx="8" fill="#C4A254" stroke="#C4A254" stroke-width="2"/>
    <rect x="128" y="0" width="56" height="56" rx="8" fill="#6B9E7A" stroke="#6B9E7A" stroke-width="2"/>
    <rect x="192" y="0" width="56" height="56" rx="8" fill="#8B68B5" stroke="#8B68B5" stroke-width="2"/>
    <rect x="256" y="0" width="56" height="56" rx="8" fill="#8B68B5" stroke="#8B68B5" stroke-width="2"/>
    <text x="28" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">4</text>
    <text x="92" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">1</text>
    <text x="156" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">7</text>
    <text x="220" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">2</text>
    <text x="284" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">9</text>
  </g>

  <!-- Row 3: all correct -->
  <g transform="translate(444, 273)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="#6B9E7A" stroke="#6B9E7A" stroke-width="2"/>
    <rect x="64" y="0" width="56" height="56" rx="8" fill="#6B9E7A" stroke="#6B9E7A" stroke-width="2"/>
    <rect x="128" y="0" width="56" height="56" rx="8" fill="#6B9E7A" stroke="#6B9E7A" stroke-width="2"/>
    <rect x="192" y="0" width="56" height="56" rx="8" fill="#6B9E7A" stroke="#6B9E7A" stroke-width="2"/>
    <rect x="256" y="0" width="56" height="56" rx="8" fill="#6B9E7A" stroke="#6B9E7A" stroke-width="2"/>
    <text x="28" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">4</text>
    <text x="92" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">7</text>
    <text x="156" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">2</text>
    <text x="220" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">1</text>
    <text x="284" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">9</text>
  </g>

  <!-- Keyboard row 1: 1 2 3 4 5 -->
  <g transform="translate(468, 355)">
    <rect x="0" y="0" width="48" height="44" rx="6" fill="#1F1E1D"/>
    <rect x="54" y="0" width="48" height="44" rx="6" fill="#1F1E1D"/>
    <rect x="108" y="0" width="48" height="44" rx="6" fill="#1F1E1D"/>
    <rect x="162" y="0" width="48" height="44" rx="6" fill="#1F1E1D"/>
    <rect x="216" y="0" width="48" height="44" rx="6" fill="#1F1E1D"/>
    <text x="24" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#EDEDED">1</text>
    <text x="78" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#EDEDED">2</text>
    <text x="132" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#EDEDED">3</text>
    <text x="186" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#EDEDED">4</text>
    <text x="240" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#EDEDED">5</text>
  </g>

  <!-- Keyboard row 2: 6 7 8 9 0 -->
  <g transform="translate(468, 405)">
    <rect x="0" y="0" width="48" height="44" rx="6" fill="#1F1E1D"/>
    <rect x="54" y="0" width="48" height="44" rx="6" fill="#1F1E1D"/>
    <rect x="108" y="0" width="48" height="44" rx="6" fill="#1F1E1D"/>
    <rect x="162" y="0" width="48" height="44" rx="6" fill="#1F1E1D"/>
    <rect x="216" y="0" width="48" height="44" rx="6" fill="#1F1E1D"/>
    <text x="24" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#EDEDED">6</text>
    <text x="78" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#EDEDED">7</text>
    <text x="132" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#EDEDED">8</text>
    <text x="186" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#EDEDED">9</text>
    <text x="240" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#EDEDED">0</text>
  </g>

  <!-- Keyboard row 3: ENTER + ⌫ -->
  <g transform="translate(468, 455)">
    <rect x="0" y="0" width="120" height="44" rx="6" fill="#1F1E1D"/>
    <rect x="144" y="0" width="120" height="44" rx="6" fill="#1F1E1D"/>
    <text x="60" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#EDEDED">ENTER</text>
    <text x="204" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#EDEDED">&#x232B;</text>
  </g>
</svg>

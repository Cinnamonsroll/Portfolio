<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <rect width="1200" height="600" fill="#0f0f1a"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse">
      <line x1="48" y1="0" x2="48" y2="48" stroke="#1a1a2e" stroke-width="0.5"/>
      <line x1="0" y1="48" x2="48" y2="48" stroke="#1a1a2e" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="gl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="id" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#g)"/>
  <rect width="1200" height="600" fill="url(#gl)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="1" fill="#8b5cf6" opacity="0.15"/>

  <!-- Bottom accent line -->
  <rect x="0" y="599" width="1200" height="1" fill="#8b5cf6" opacity="0.25"/>

  <!-- Side decorative elements -->
  <rect x="60" y="60" width="16" height="16" rx="4" stroke="#8b5cf6" stroke-width="1.5" opacity="0.3"/>
  <rect x="1124" y="524" width="16" height="16" rx="4" stroke="#8b5cf6" stroke-width="1.5" opacity="0.3"/>

  <!-- trigr logo icon -->
  <g transform="translate(565, 150)">
    <rect x="0" y="0" width="70" height="70" rx="16" fill="url(#id)"/>
    <path d="M19,16 L14,16 L10,26 L10,36 L14,46 L19,46" stroke="#8b5cf6" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M51,16 L56,16 L60,26 L60,36 L56,46 L51,46" stroke="#8b5cf6" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40,12 L30,34 L35,34 L34,53 L49,31 L40,31 Z" fill="#a78bfa" stroke="#c4b5fd" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- trigr wordmark -->
  <text x="600" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="#f0ebe3" letter-spacing="-0.02em">trigr</text>

  <!-- Tagline -->
  <text x="600" y="352" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#a89f93" letter-spacing="0.01em">Text expansion at your fingertips</text>

  <!-- Decorative shortcut hints -->
  <g opacity="0.12">
    <rect x="88" y="500" width="90" height="28" rx="6" stroke="#f0ebe3" stroke-width="1" fill="none"/>
    <text x="133" y="519" text-anchor="middle" font-family="monospace" font-size="11" fill="#f0ebe3">;;sig</text>
    <line x1="200" y1="514" x2="218" y2="514" stroke="#f0ebe3" stroke-width="1.5"/>
    <text x="240" y="519" font-family="system-ui, sans-serif" font-size="12" fill="#f0ebe3" opacity="0.5">Sign your emails</text>
  </g>

  <g opacity="0.08">
    <rect x="850" y="400" width="90" height="28" rx="6" stroke="#f0ebe3" stroke-width="1" fill="none"/>
    <text x="895" y="419" text-anchor="middle" font-family="monospace" font-size="11" fill="#f0ebe3">;;addr</text>
    <line x1="962" y1="414" x2="980" y2="414" stroke="#f0ebe3" stroke-width="1.5"/>
    <text x="1002" y="419" font-family="system-ui, sans-serif" font-size="12" fill="#f0ebe3" opacity="0.5">Paste your address</text>
  </g>

  <!-- Decorative dot -->
  <circle cx="600" cy="380" r="2" fill="#8b5cf6" opacity="0.4"/>
</svg>
